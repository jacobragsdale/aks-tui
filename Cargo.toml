[package]
name = "aks-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast terminal browser for AKS: pods, logs, events, configmaps and secrets across clusters and namespaces"
license = "MIT"
repository = "https://github.com/jacobragsdale/aks-tui"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
nucleo-matcher = "0.3"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
toml = "0.9"

[profile.release]
lto = "thin"
strip = "symbols"
